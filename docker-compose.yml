services:
  # 1. FastAPI Web & WebSocket Server
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: autoapply-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=${APP_ENV:-production}
      - DEBUG=${DEBUG:-false}
      # Required: copy .env.example to .env at the repo root and fill these in (SEC-03).
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY in .env}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in .env}
      - DATABASE_URL=sqlite+aiosqlite:///./storage/app.db
      - STORAGE_DIR=/app/storage
      - BROWSER_HEADLESS=true
    # The image runs as uid 10001: `sudo chown -R 10001 ./storage` once if the host folder is root-owned.
    volumes:
      - ./storage:/app/storage
      - ./backend/app:/app/app

  # 2. React Vite Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: autoapply-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
